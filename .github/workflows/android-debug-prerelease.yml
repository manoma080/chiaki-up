name: Android debug prerelease

on:
  push:
    branches:
      - master-mano

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out Android native dependencies
        run: |
          git submodule update --init --depth 1 -- \
            android/app/src/main/cpp/oboe \
            third-party/nanopb third-party/jerasure third-party/gf-complete

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler python3-venv
          python3 -m venv "$RUNNER_TEMP/chiaki-python"
          "$RUNNER_TEMP/chiaki-python/bin/pip" install 'protobuf==4.25.8' 'setuptools==80.9.0'
          echo "$RUNNER_TEMP/chiaki-python/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' \
            'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Save APK for release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-debug-apk

      - name: Create prerelease for this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          tag="android-debug-${RUN_ID}-${RUN_ATTEMPT}"
          gh release create "$tag" app-debug.apk \
            --target "$COMMIT_SHA" \
            --title "Android debug ${RUN_ID}.${RUN_ATTEMPT}" \
            --notes "Debug APK built from commit ${COMMIT_SHA}. Debug signing keys may differ between runs." \
            --prerelease
